<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#131c2e;--tx:#e8eef8;--mu:#91a3bd;--ac:#60a5fa;--ac2:#1b2a47;--bd:#243350}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#131c2e;--tx:#e8eef8;--mu:#91a3bd;--ac:#60a5fa;--ac2:#1b2a47;--bd:#243350}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{border-radius:0 0 28px 28px;background:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#0ea5e9);color:#fff;padding:28px 18px 20px;text-align:center}
header h1{margin:0;font-size:1.8rem}header p{margin:4px 0 0;opacity:.9}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--bd)}
nav button,.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;font:inherit;font-size:.92rem;cursor:pointer;white-space:nowrap}
nav button.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:860px;margin:0 auto;padding:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:0 0 14px;overflow:hidden;box-shadow:0 4px 18px rgba(30,64,175,.08)}
h2{margin:0 0 4px;font-size:1.3rem}h3{margin:14px 0 6px;font-size:1rem;color:var(--ac)}
.mu{color:var(--mu);font-size:.9rem}
.tl{list-style:none;padding:0;margin:0}.tl li{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--bd)}
.tl b{min-width:78px;color:var(--ac);font-variant-numeric:tabular-nums}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:8px;padding:2px 9px;font-size:.82rem;margin:2px 4px 2px 0}
.warn{background:var(--ac2);border-left:4px solid var(--ac);padding:8px 12px;border-radius:8px;margin:10px 0}
input[type=search]{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
table{width:100%;border-collapse:collapse}td{padding:7px 4px;border-bottom:1px solid var(--bd)}td:last-child{text-align:right;font-weight:600}
.wrap{overflow-x:auto}ul.l{padding-left:20px;margin:4px 0}label{display:block;padding:3px 0}
.go{color:var(--ac);cursor:pointer;text-decoration:underline}
.nv{display:flex;justify-content:space-between;margin-top:8px}
</style></head><body>
